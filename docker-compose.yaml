services:
  app-led:
    build:
      context: .
      dockerfile: Dockerfile
    image: raspberry-out:1.0
    container_name: app-led
    ports:
      - "${APP_PORT}:${APP_PORT}"
      - "9090:9090"
    privileged: true
    devices:
      - "/dev/gpiochip0:/dev/gpiochip4"
      - "/dev/gpiochip0:/dev/gpiochip0"
    restart: always
    environment:
      - SERVER_PORT=${APP_PORT}
      - LOG_PATH=/app/logs
      - JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED
      - DIOZERO_DEVICE_FACTORY=com.diozero.internal.provider.gpiod.GpiodDeviceFactory
      - DIOZERO_GPIO_CHIP=0
    volumes:
      - ./log/app-led:/app/logs
      - /dev:/dev
      - /sys:/sys:ro
      - /sys/firmware/devicetree/base:/proc/device-tree:ro
    networks:
      - rpi-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app-botao:
    build:
      context: ../raspberry_house
      dockerfile: Dockerfile
    image: raspberry-in:1.0
    container_name: app-botao
    depends_on:
      app-led:
        condition: service_healthy
    restart: always
    environment:
      - APP_COMMUNICATION_TYPE=${COMM_TYPE:?A variavel COMM_TYPE (rest ou grpc) e obrigatoria}
      - LED_SERVICE_URL=app-led
      - APP_LED_URL=http://app-led:8090
      - GRPC_LED_HOST=app-led
      - JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED
      - DIOZERO_DEVICE_FACTORY=com.diozero.internal.provider.gpiod.GpiodDeviceFactory
      - DIOZERO_GPIO_CHIP=0
    privileged: true
    devices:
      - "/dev/gpiochip0:/dev/gpiochip4"
      - "/dev/gpiochip0:/dev/gpiochip0"
    volumes:
      - ./log/app-botao:/app/logs
      - /dev:/dev
      - /sys:/sys:ro
      - /sys/firmware/devicetree/base:/proc/device-tree:ro
    networks:
      - rpi-network

networks:
  rpi-network:
    driver: bridge